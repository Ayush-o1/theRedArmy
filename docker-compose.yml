# Local infrastructure for development.
#   docker compose up -d redis              -> Redis only (use your own Postgres)
#   docker compose up -d redis postgres     -> Redis + Postgres for `npm run dev`
#   docker compose --profile full up --build -> everything in containers
#       (needs ENCRYPTION_KEY in your shell or a .env file next to this one)
# Postgres is exposed on 5433 so it does not clash with a local install on 5432.
x-app: &app
  build: .
  profiles: ['full']
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://promptgate:promptgate@postgres:5432/promptgate?schema=public
    REDIS_URL: redis://redis:6379/0
    # Passed through as-is. The app refuses to start if it is empty or the wrong
    # length. (A compose-level "required" check would also break
    # `docker compose up postgres`, which does not need the key.)
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    LOG_LEVEL: info
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: promptgate
      POSTGRES_PASSWORD: promptgate
      POSTGRES_DB: promptgate
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'promptgate']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies database migrations once, then exits. api and worker wait for it.
  migrate:
    <<: *app
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  api:
    <<: *app
    ports:
      - '3000:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ['node', 'src/worker.js']
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:

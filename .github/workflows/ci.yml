# Runs on every push and pull request: static checks, then the full test
# suite against real Postgres and Redis containers, then the browser tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: theredarmy
          POSTGRES_PASSWORD: theredarmy
          POSTGRES_DB: theredarmy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U theredarmy"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://theredarmy:theredarmy@localhost:5432/theredarmy_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      # Tests start a mock provider on 127.0.0.1, so private URLs are allowed here.
      ALLOW_PRIVATE_PROVIDER_URLS: 'true'
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # A fresh random key per run: nothing secret is stored in the repository.
      - name: Generate test encryption key
        run: echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
